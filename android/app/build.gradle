plugins {
    id "com.android.application"
}

// The web app (HTML/CSS/JS, icons and the Excel word list) lives in the repository root.
// It is copied into the APK's assets at build time, so updating the Excel file and
// pushing to GitHub produces a new APK with the new words.
def webRoot = rootProject.file("..")
def webAssetsDir = layout.buildDirectory.dir("generated/webassets").get().asFile

// Copy the web files while Gradle reads this script (before any task runs), so every
// Android task simply sees them as ordinary asset files.
delete(webAssetsDir)
copy {
    from(webRoot) {
        include "index.html", "style.css", "app.js", "xlsx-reader.js", "inflate.js",
                "manifest.webmanifest", "*.xlsx", "icons/**"
        exclude "android/**", ".git/**", ".github/**"
    }
    into new File(webAssetsDir, "www")
}

// Signing key. The APK on the Releases page uses the key in android/keystore (its password is
// public, which is fine for a direct-download APK). The Play Store bundle is signed instead with
// your private upload key, passed in through the ANDROID_* settings by build-play-bundle.yml.
def ksFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: rootProject.file("keystore/shabdavali.jks").path
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "shabdavali123"
def keyAliasName = System.getenv("ANDROID_KEY_ALIAS") ?: "shabdavali"
def keyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: "shabdavali123"

android {
    namespace "com.prashasanik.shabdavali"
    compileSdk 36

    defaultConfig {
        applicationId "prashasanik.shabdavali"
        minSdk 24
        targetSdk 36
        // Each GitHub build gets a higher version, so a new APK installs over the old one.
        // The Play Store build sets APP_VERSION_CODE itself (see build-play-bundle.yml).
        def buildNo = System.getenv("APP_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        versionCode buildNo.toInteger()
        versionName "1." + buildNo
    }

    signingConfigs {
        release {
            storeFile file(ksFile)
            storePassword ksPass
            keyAlias keyAliasName
            keyPassword keyPass
            storeType "pkcs12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDir(webAssetsDir)
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
