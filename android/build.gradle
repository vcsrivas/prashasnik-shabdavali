plugins {
    id "com.android.application"
}

// The web app (HTML/CSS/JS, icons and the Excel word list) lives in the repository root.
// It is copied into the APK's assets at build time, so updating the Excel file and
// pushing to GitHub produces a new APK with the new words.
def webRoot = rootProject.file("..")
def webAssetsDir = layout.buildDirectory.dir("generated/webassets").get().asFile

// Copy the web files while Gradle reads this script (before any task runs), so every
// Android task simply sees them as ordinary asset files.
delete(webAssetsDir)
copy {
    from(webRoot) {
        include "index.html", "style.css", "app.js", "xlsx-reader.js", "inflate.js",
                "manifest.webmanifest", "*.xlsx", "icons/**"
        exclude "android/**", ".git/**", ".github/**"
    }
    into new File(webAssetsDir, "www")
}

// Signing key (android/keystore). Keeping the same key lets each new APK install over the old one.
def ksFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: rootProject.file("keystore/shabdavali.jks").path
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "shabdavali123"
def keyAliasName = System.getenv("ANDROID_KEY_ALIAS") ?: "shabdavali"
def keyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: "shabdavali123"

android {
    namespace "com.prashasnik.shabdavali"
    compileSdk 35

    defaultConfig {
        applicationId "com.prashasnik.shabdavali"
        minSdk 24
        targetSdk 35
        // Each GitHub build gets a higher version, so a new APK installs over the old one.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            storeFile file(ksFile)
            storePassword ksPass
            keyAlias keyAliasName
            keyPassword keyPass
            storeType "pkcs12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDir(webAssetsDir)
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
