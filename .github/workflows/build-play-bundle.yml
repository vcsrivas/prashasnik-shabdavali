# Builds the signed Android App Bundle (.aab) to upload to the Google Play Console.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_PASSWORD   the password you chose for the upload key
#   UPLOAD_KEYSTORE_BASE64     the text from upload-keystore-base64.txt
#                              (made by the "Create Play Store upload key" workflow)
#
# Run it from: Actions tab → "Build Play Store bundle (.aab)" → Run workflow.
# The .aab appears under Artifacts on the run page. Each run gets a higher version code,
# which Google Play needs for every new upload.

name: Build Play Store bundle (.aab)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (leave empty to use this workflow's run number). Must be higher than the last one uploaded to Play."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: play-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the signing secrets
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$PW" ] || missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$KS" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Run 'Create Play Store upload key' first and follow its steps."
            exit 1
          fi

      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licences and install SDK parts
        run: |
          set +o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" > /dev/null || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore the upload key
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$PW" -alias upload > /dev/null 2>&1; then
            echo "::error::The upload key could not be opened. Check that UPLOAD_KEYSTORE_BASE64 holds the whole text of upload-keystore-base64.txt and that UPLOAD_KEYSTORE_PASSWORD is the same password used to create it."
            exit 1
          fi
          UPLOAD_SHA="$(keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$PW" -alias upload | awk '/SHA256:/ {print $2; exit}')"
          echo "UPLOAD_SHA=$UPLOAD_SHA" >> "$GITHUB_ENV"
          echo "Upload key OK (SHA-256 $UPLOAD_SHA)"

      - name: Choose the version code
        env:
          IN_CODE: ${{ inputs.version_code }}
        run: |
          CODE="${IN_CODE:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$CODE" =~ ^[0-9]+$ ]] || [ "$CODE" -lt 1 ] || [ "$CODE" -gt 2100000000 ]; then
            echo "::error::Version code must be a whole number from 1 to 2100000000 (got '$CODE')."
            exit 1
          fi
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version code: $CODE (version name 1.$CODE)"

      - name: Build the signed bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: gradle -p android bundleRelease --no-daemon --stacktrace

      - name: Check the signature
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" > /dev/null
          SIGNED_SHA="$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/ {print $2; exit}')"
          echo "Bundle signed by SHA-256 $SIGNED_SHA"
          if [ -z "$SIGNED_SHA" ] || [ "$SIGNED_SHA" != "$UPLOAD_SHA" ]; then
            echo "::error::The bundle was not signed with your upload key, so it was not published."
            exit 1
          fi
          OUT="prashasanik.shabdavali-v${APP_VERSION_CODE}.aab"
          cp "$AAB" "$OUT"
          echo "AAB_FILE=$OUT" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Offer the bundle for download
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-v${{ env.APP_VERSION_CODE }}
          path: ${{ env.AAB_FILE }}
          retention-days: 30
          compression-level: 0

      - name: What to do next
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Play Store bundle ready

          **${AAB_FILE}** · version code **${APP_VERSION_CODE}** · version name **1.${APP_VERSION_CODE}**

          1. Scroll down to **Artifacts** and download **play-bundle-v${APP_VERSION_CODE}** (a zip holding the .aab; unzip it).
          2. In the Google Play Console open your app → **Test and release** → a track (e.g. Internal testing) → **Create new release**.
          3. When asked about app signing, keep **Google Play App Signing** (recommended). Google keeps the final signing key; your key is only the upload key.
          4. Upload the .aab, add release notes and roll out.
          EOF
